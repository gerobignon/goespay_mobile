<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>GoesPay</title>
    <script>
      // Capture beforeinstallprompt before React mounts; the in-app banner
      // reads window.__pwaDeferredPrompt on mount so the install button
      // works on Chrome even when the event fires before the component.
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__pwaDeferredPrompt = e;
      });
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GoesPay" />
    <meta name="theme-color" content="#3176FE" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      /* Verrouille le document : seuls les ScrollView internes scrollent.
         Empêche iOS Safari de décaler la page au focus d'un input. */
      html, body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: manipulation;
        background-color: #0b0d1a;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      #root {
        flex: 1 1 auto;
        min-height: 0;
        height: auto;
        width: 100%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      /* Empêche l'auto-zoom iOS sur focus d'un input (font-size >= 16px requis) */
      input, textarea, select {
        font-size: 16px !important;
      }
    </style>
  </head>
  <body>
    <noscript>JavaScript est requis pour utiliser GoesPay.</noscript>
    <div id="root"></div>
  </body>
</html>
